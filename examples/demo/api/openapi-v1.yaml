openapi: 3.0.3
info: {title: Demo Users API, version: 1.0.0}
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewUser"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: One user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
    delete:
      operationId: deleteUser
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Deleted}
components:
  schemas:
    User:
      type: object
      required: [id, name, email, status]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
        status: {type: string, enum: [active, pending, disabled]}
    NewUser:
      type: object
      required: [name]
      properties:
        name: {type: string}
        email: {type: string, format: email}
