openapi: 3.0.3
info: {title: Demo Users API, version: 2.0.0}
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewUser"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /users/{userId}:
    get:
      operationId: getUser
      parameters:
        - {name: userId, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: One user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
components:
  schemas:
    User:
      type: object
      required: [id, full_name, email, status]
      properties:
        id: {type: integer}
        full_name: {type: string}
        email: {type: string, format: email}
        status: {type: string, enum: [active, disabled]}
    NewUser:
      type: object
      required: [full_name, email]
      properties:
        full_name: {type: string}
        email: {type: string, format: email}
