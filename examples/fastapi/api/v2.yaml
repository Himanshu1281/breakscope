openapi: 3.1.0
info: {title: Orders API, version: "2.0"}
servers: [{url: "https://orders.internal/v1"}]
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, shipped, cancelled]}}
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Order"}}
  /orders/{id}:
    get:
      operationId: getOrder
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: One order (items are now embedded)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
components:
  schemas:
    Order:
      type: object
      required: [id, customer, total, status]
      properties:
        id: {type: string}
        customer: {type: string}
        total: {type: string, description: Decimal amount, e.g. "12.50"}
        status: {type: string, enum: [open, shipped, cancelled]}
        items: {type: array, items: {$ref: "#/components/schemas/Item"}}
    Item:
      type: object
      properties:
        sku: {type: string}
        quantity: {type: integer}
