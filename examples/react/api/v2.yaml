openapi: 3.0.3
info: {title: Blog API, version: "2.0"}
paths:
  /posts:
    get:
      operationId: listPosts
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Post"}}
  /posts/{slug}:
    get:
      operationId: getPost
      parameters: [{name: slug, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Post"}
components:
  schemas:
    Author:
      type: object
      required: [displayName]
      properties:
        displayName: {type: string}
        avatar: {type: string}
    Post:
      type: object
      required: [slug, title, author, publishedAt]
      properties:
        slug: {type: string}
        title: {type: string}
        author: {$ref: "#/components/schemas/Author"}
        publishedAt: {type: string, format: date-time, nullable: true}
