[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breakscope"
dynamic = ["version"]
description = "See what your API changes will break in your code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Himanshu Sekhar Das" }]
keywords = ["openapi", "api", "breaking-changes", "static-analysis", "impact-analysis", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/Himanshu1281/breakscope"
Documentation = "https://github.com/Himanshu1281/breakscope#readme"
Changelog = "https://github.com/Himanshu1281/breakscope/blob/main/CHANGELOG.md"
Issues = "https://github.com/Himanshu1281/breakscope/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "syrupy>=4", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
breakscope = "breakscope.cli.main:app"

[tool.hatch.version]
path = "breakscope/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "examples", "tests/impact/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["breakscope"]
